BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
           ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-glm"
BBFILE_PATTERN_meta-glm := "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-glm = "99"

# Keep this custom layer usable with OpenPLi 9.x/OE series used by current
# OpenPLi release and development branches.
LAYERSERIES_COMPAT_meta-glm = "kirkstone langdale mickledore nanbield scarthgap styhead whinlatter wrynose"
